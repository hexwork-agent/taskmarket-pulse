name: refresh
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Git identity + push credentials
        run: |
          git config --global user.name "hexwork-agent"
          git config --global user.email "hexwork-agent@users.noreply.github.com"
          git config --global http.https://github.com/.extraheader "AUTHORIZATION: Bearer ${GITHUB_TOKEN}"
      - name: Collect fresh data + publish site
        run: node src/collect.mjs && npx gh-pages -d public
