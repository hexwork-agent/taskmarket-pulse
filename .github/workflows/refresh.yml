name: refresh
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Collect fresh data + publish site
        run: |
          node src/collect.mjs
          python3 - <<'PY'
          import json, os, base64, urllib.request
          os.chdir('public')
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          def api(method, path, body=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(
                  'https://api.github.com/repos/' + repo + path, data=data, method=method,
                  headers={'Authorization': 'Bearer ' + token,
                           'Accept': 'application/vnd.github+json',
                           'User-Agent': 'refresh', 'Content-Type': 'application/json'})
              with urllib.request.urlopen(req, timeout=120) as r:
                  return json.loads(r.read().decode())
          entries = []
          for root, dirs, files in os.walk('.'):
              for f in sorted(files):
                  p = os.path.join(root, f)
                  rel = os.path.relpath(p, '.')
                  raw = open(p, 'rb').read()
                  try:
                      enc = {'content': raw.decode('utf-8'), 'encoding': 'utf8'}
                  except UnicodeDecodeError:
                      enc = {'content': base64.b64encode(raw).decode(), 'encoding': 'base64'}
                  blob = api('POST', '/git/blobs', enc)
                  entries.append({"path": rel, "mode": "100644", "type": "blob", "sha": blob['sha']})
          open('/tmp/tree_body.json', 'w').write(json.dumps({"tree": entries}))
          print("files:", len(entries))
          PY
          TREE=$(gh api repos/$GITHUB_REPOSITORY/git/trees --input /tmp/tree_body.json --jq .sha)
          PARENT=$(gh api repos/$GITHUB_REPOSITORY/branches/gh-pages --jq .commit.sha 2>/dev/null || true)
          if [ -n "$PARENT" ]; then
            printf '{"tree":"%s","parents":["%s"],"message":"hourly refresh (actions)"}' "$TREE" "$PARENT" > /tmp/commit_body.json
          else
            printf '{"tree":"%s","message":"hourly refresh (actions)"}' "$TREE" > /tmp/commit_body.json
          fi
          CSHA=$(gh api repos/$GITHUB_REPOSITORY/git/commits --input /tmp/commit_body.json --jq .sha)
          gh api -X PUT repos/$GITHUB_REPOSITORY/git/refs/heads/gh-pages -f sha="$CSHA" -F force=true
          echo "published commit $CSHA"
